<div class="search-shell">
  <div class="search-bar" role="search">
    <label class="search-label" for="vehicle-search">Brand</label>
    <input
      id="vehicle-search"
      type="text"
      placeholder="Search by brand or model"
      #brand
      (input)="selectAutos(brand.value)"
    />
    <fa-icon [icon]="faMagnifyingGlass"></fa-icon>
  </div>

  <div class="cars-container" aria-live="polite">
    @for (auto of selectedAutos; track auto.id) {
      <article class="auto-card">
        <img [src]="'images/' + auto.photo" [alt]="auto.brand + ' ' + auto.model" />
        <div class="details">
          <div class="header-row">
            <h3>{{ auto.brand }} {{ auto.model }}</h3>
            <span class="price">{{ auto.price }}k</span>
          </div>
          <ul>
            <li><strong>Power:</strong> {{ auto.power }} HP</li>
            <li><strong>Stock:</strong> {{ auto.availability }} units</li>
          </ul>
        </div>
        <div class="see-more">
          <button type="button" (click)="selectCar(auto)">See more</button>
        </div>
      </article>
    } @empty {
      <p class="empty-state">No vehicles match that search. Try another brand or model.</p>
    }
  </div>
</div>
